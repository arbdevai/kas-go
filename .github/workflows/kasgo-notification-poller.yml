name: Kas Go push notifications (free poller)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kasgo-notification-poller
  cancel-in-progress: false

jobs:
  poll-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      KASGO_NOTIFICATION_SERVICE_ACCOUNT: ${{ secrets.KASGO_NOTIFICATION_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install notification sender
        if: ${{ env.KASGO_NOTIFICATION_SERVICE_ACCOUNT != '' }}
        run: npm ci --prefix functions --omit=dev --no-audit --no-fund
      - name: Poll Firestore and send FCM notifications
        if: ${{ env.KASGO_NOTIFICATION_SERVICE_ACCOUNT != '' }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/kasgo-notification-service-account.json"
          printf '%s' "$KASGO_NOTIFICATION_SERVICE_ACCOUNT" > "$key_file"
          GOOGLE_APPLICATION_CREDENTIALS="$key_file" node functions/notification-poller.js
