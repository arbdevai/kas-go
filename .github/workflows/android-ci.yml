name: Android CI (Kas Go Production APK)

on:
  push:
    branches:
      - master
      - main
      - "worktree-*"
      - "feat-*"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.22.2"
  JAVA_VERSION: "17"

jobs:
  build-demo-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Generate Android shell from SDK template with consistent signing & icons
        run: |
          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            STAGING_DIR="$(mktemp -d)"
            ANDROID_PKG="id.or.karangtaruna.kasgo"
            flutter create --platforms=android \
              --project-name kas_go \
              --org id.or.karangtaruna \
              --android-language kotlin \
              "$STAGING_DIR/kas_go_template"
            mkdir -p android
            cp -r "$STAGING_DIR/kas_go_template/android/." android/
            sed -i "s/^applicationId .*/applicationId \"$ANDROID_PKG\"/" android/app/build.gradle || true
            sed -i "s/^namespace .*/namespace \"$ANDROID_PKG\"/" android/app/build.gradle || true
            rm -rf "$STAGING_DIR"
          fi

          # Setup app launcher icon for Android mipmap
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          cp assets/images/icon_48.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png || true
          cp assets/images/icon_72.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png || true
          cp assets/images/icon_96.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
          cp assets/images/icon_144.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
          cp assets/images/icon_192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true

          # Pasang Keystore Permanen dari repositori ke ~/.android/debug.keystore
          mkdir -p ~/.android
          if [ -f android/app/keystore/kasgo_release.p12 ]; then
            cp android/app/keystore/kasgo_release.p12 ~/.android/debug.keystore
            echo "Keystore permanen repositori terpasang (alias: androiddebugkey, pass: android)."
          fi

      - name: Pub get
        run: flutter pub get

      - name: Drift code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format check
        run: dart format --set-exit-if-changed lib test 2>/dev/null || dart format lib test

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test

      - name: Build production APK (v1+v2+v3 signed)
        run: flutter build apk --debug --dart-define=APP_FLAVOR=production

      - name: Rename production APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/kas-go-app.apk
          ls -lh dist/

      - name: Prepare release notes
        run: |
          cat << 'EOF' > /tmp/release_notes.md
          ### Kas Go v1.0.1 — Aplikasi Kas Karang Taruna (Rilis Resmi)

          Pembaruan:
          - **UI Bersih & Profesional**:
            - Menghilangkan banner debug pada layar aplikasi
            - Menghapus badge pemanis dan merapikan seluruh teks ke bahasa Indonesia baku
            - Tata letak konsisten tema putih porselen dan royal amethyst
            - Floating Dock Navigation Bar 2026
            - Startup Splash Screen beranimasi mulus
          - **Tanda Tangan Kunci Permanen**:
            - Keystore terstandarisasi v1+v2+v3 permanen di repositori sehingga pembaruan aplikasi dapat langsung menimpa tanpa mencopot versi lama.
          - **Sinkronisasi & Fungsionalitas**:
            - Pencatatan kas masuk & pengeluaran oleh 3 Admin
            - Terintegrasi langsung dengan Cloud Firestore Jakarta

          #### Cara Pasang:
          1. Unduh file **kas-go-app.apk** di bagian Assets di bawah.
          2. Pasang langsung di smartphone Android Anda.
          EOF

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.1"
          gh release delete "$TAG_NAME" --yes --cleanup-tag 2>/dev/null || true
          ls -lh dist/kas-go-app.apk
          gh release create "$TAG_NAME" "dist/kas-go-app.apk#kas-go-app.apk" \
            --title "Kas Go v1.0.1 (Production APK)" \
            --notes-file /tmp/release_notes.md
          echo "Verifikasi berkas rilis terbit:"
          gh release view "$TAG_NAME"
