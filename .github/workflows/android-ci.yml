name: Android CI (Kas Go Production APK)

on:
  push:
    branches:
      - master
      - main
      - "worktree-*"
      - "feat-*"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.22.2"
  JAVA_VERSION: "17"

jobs:
  build-demo-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Generate Android shell from SDK template with consistent signing & icons
        run: |
          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            STAGING_DIR="$(mktemp -d)"
            ANDROID_PKG="id.or.karangtaruna.kasgo"
            flutter create --platforms=android \
              --project-name kas_go \
              --org id.or.karangtaruna \
              --android-language kotlin \
              "$STAGING_DIR/kas_go_template"
            mkdir -p android
            cp -r "$STAGING_DIR/kas_go_template/android/." android/
            sed -i "s/^applicationId .*/applicationId \"$ANDROID_PKG\"/" android/app/build.gradle || true
            sed -i "s/^namespace .*/namespace \"$ANDROID_PKG\"/" android/app/build.gradle || true
            rm -rf "$STAGING_DIR"
          fi

          # Setup app launcher icon for Android mipmap
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          cp assets/images/icon_48.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png || true
          cp assets/images/icon_72.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png || true
          cp assets/images/icon_96.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
          cp assets/images/icon_144.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
          cp assets/images/icon_192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true

          # Generate consistent dedicated debug keystore so app updates don't require uninstallation
          mkdir -p android/app/keystore ~/.android
          if [ ! -f android/app/keystore/debug.keystore ]; then
            keytool -genkey -v \
              -keystore android/app/keystore/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=KasGo, OU=KarangTaruna, O=KasGo, L=Jakarta, ST=DKI, C=ID"
          fi
          cp android/app/keystore/debug.keystore ~/.android/debug.keystore

      - name: Pub get
        run: flutter pub get

      - name: Drift code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format check
        run: dart format --set-exit-if-changed lib test 2>/dev/null || dart format lib test

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test

      - name: Build production APK (v1+v2+v3 signed)
        run: flutter build apk --debug --dart-define=APP_FLAVOR=production

      - name: Rename production APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/kas-go-app.apk
          ls -lh dist/

      - name: Prepare release notes
        run: |
          cat << 'EOF' > /tmp/release_notes.md
          ### Kas Go v1.0.0 — Aplikasi Kas Karang Taruna (Versi Produksi)

          Fitur Utama:
          - **UI/UX Modern 2026**:
            - Tema Putih Porselen + Ungu Royal Premium (#5B21B6)
            - Hero Card Royal Amethyst Gradient (tanpa AppBar web kaku)
            - Floating Dock Bottom Navigation Bar 2026
            - Menu Grid 4 Kolom dengan teks 2 baris
            - Grouped Transaction Surface (Bebas Card Fatigue)
            - Startup Splash Screen dengan animasi scale & fade mulus
          - **Fungsi Finansial Nyata**:
            - Pencatatan kas masuk & pengeluaran oleh 3 Admin dengan audit trail
            - Penyimpanan data lokal persisten & real-time
            - Hub Pembayaran: Scan QRIS, Transfer BCA, dan Form Jemput Kas ke Rumah
            - Visualizer 3 Grafik: Pemasukan, Pengeluaran, Saldo Kumulatif
          - **Tanda Tangan Konsisten**:
            - Keystore terstandarisasi v1+v2+v3 agar pembaruan APK selanjutnya langsung menimpa tanpa perlu copot aplikasi lama.

          #### Cara Pasang:
          1. Unduh file **kas-go-app.apk** di bagian Assets di bawah.
          2. Pasang langsung di smartphone Android Anda.
          EOF

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Kas Go v1.0.0 (Production APK)"
          body_path: /tmp/release_notes.md
          prerelease: false
          files: dist/kas-go-app.apk
