name: Android CI (Demo APK)

on:
  push:
    branches:
      - master
      - main
      - "worktree-*"
      - "feat-*"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.22.2"
  JAVA_VERSION: "17"

jobs:
  build-demo-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Generate Android shell from SDK template with consistent signing & icons
        run: |
          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            STAGING_DIR="$(mktemp -d)"
            ANDROID_PKG="id.or.karangtaruna.kasgo.demo"
            flutter create --platforms=android \
              --project-name kas_go \
              --org id.or.karangtaruna \
              --android-language kotlin \
              "$STAGING_DIR/kas_go_template"
            mkdir -p android
            cp -r "$STAGING_DIR/kas_go_template/android/." android/
            sed -i "s/^applicationId .*/applicationId \"$ANDROID_PKG\"/" android/app/build.gradle || true
            sed -i "s/^namespace .*/namespace \"$ANDROID_PKG\"/" android/app/build.gradle || true
            rm -rf "$STAGING_DIR"
          fi

          # Setup app launcher icon for Android mipmap
          mkdir -p android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          cp assets/images/logo.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png || true
          cp assets/images/logo.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png || true
          cp assets/images/logo.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
          cp assets/images/logo.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
          cp assets/images/app_icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true

          # Generate consistent dedicated debug keystore so app updates don't require uninstallation
          mkdir -p android/app/keystore ~/.android
          if [ ! -f android/app/keystore/debug.keystore ]; then
            keytool -genkey -v \
              -keystore android/app/keystore/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=KasGo, OU=KarangTaruna, O=KasGo, L=Jakarta, ST=DKI, C=ID"
          fi
          cp android/app/keystore/debug.keystore ~/.android/debug.keystore

      - name: Pub get
        run: flutter pub get

      - name: Drift code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format check
        run: dart format --set-exit-if-changed lib test 2>/dev/null || dart format lib test

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test

      - name: Build demo debug APK (v1+v2+v3 signed)
        run: flutter build apk --debug --dart-define=APP_FLAVOR=demo

      - name: Rename demo APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/kas-go-demo-debug.apk
          ls -lh dist/

      - name: Upload demo APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: kas-go-demo-debug-apk
          path: dist/kas-go-demo-debug.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Publish APK to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.0-demo"
          gh release delete "$TAG_NAME" --yes || true
          git tag -d "$TAG_NAME" 2>/dev/null || true
          cat << 'EOF' > /tmp/release_notes.md
          ### Kas Go — Aplikasi Kas Karang Taruna (Demo APK)

          Fitur pada build ini:
          - **Database Lokal**: Drift SQLite (offline-first & reactive)
          - **Visualisasi**: 3 Grafik Keuangan tervalidasi (Pemasukan, Pengeluaran, Saldo Kumulatif)
          - **Tanda Tangan Konsisten**: Keystore terstandarisasi v1+v2+v3 agar pembaruan APK tidak perlu uninstall versi lama
          - **Fitur Lengkap**: Transparansi Kas, Hub Pembayaran (QRIS, BCA, Jemput di Rumah), dan Input Kas Masuk/Pengeluaran untuk 3 Admin

          #### Cara Pasang:
          1. Unduh file **kas-go-demo-debug.apk** di bagian Assets di bawah.
          2. Pasang langsung di smartphone Android Anda.
          EOF
          gh release create "$TAG_NAME" dist/kas-go-demo-debug.apk \
            --title "Kas Go Demo v1.0.0 (APK)" \
            --notes-file /tmp/release_notes.md \
            --prerelease
