name: Android CI (Kas Go Native Kotlin & Jetpack Compose APK)

on:
  push:
    branches:
      - master
      - main
      - "worktree-*"
      - "feat-*"
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref_name }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"

jobs:
  build-native-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
          cache-read-only: false

      - name: Prepare keystore
        run: |
          mkdir -p ~/.android
          if [ -f app/keystore/kasgo_release.p12 ]; then
            cp app/keystore/kasgo_release.p12 ~/.android/debug.keystore
            echo "Keystore resmi terpasang."
          fi

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} dist/kas-go-app.apk \;
          ls -lh dist/

      - name: Prepare release notes
        run: |
          cat << 'EOF' > /tmp/release_notes.md
          ### Kas Go v2.0.0 — Migrasi Penuh Native Android (Kotlin + Jetpack Compose)

          Pembaruan & Transformasi Arsitektur:
          - **Migrasi 100% Native Kotlin & Jetpack Compose**:
            - Kode basis ditulis penuh menggunakan Kotlin & Jetpack Compose (Material 3) untuk performa instan, konsumsi memori hemat, dan animasi super mulus
          - **Dialog Pemilihan Akun Google Native (Account Chooser)**:
            - Tombol "Masuk dengan Google" memanggil Google Play Services resmi yang langsung memunculkan lembar pemilihan akun Google yang tersinkronisasi di ponsel
          - **Alur Wajib Masuk (Auth Gate) & Onboarding Warga Baru**:
            - Pengguna wajib masuk terlebih dahulu sebelum dapat mengakses buku kas dan ringkasan keuangan
            - Akun baru otomatis menampilkan formulir pengisian Nama Lengkap, Nomor WhatsApp, dan Alamat
            - Akun yang sudah terdaftar langsung masuk ke akun tanpa pengisian ulang
          - **Perbaikan Nyata Unduh Pembaruan APK**:
            - Tombol unduh APK langsung membuka peramban / pengelola unduhan perangkat secara nyata
            - Disediakan opsi salin tautan langsung ke papan klip
          - **Desain Floating Navigation Dock & Top Floating Toast**:
            - Navigasi melayang modern 2026 dan notifikasi meluncur dari atas tanpa menabrak navigasi dock
          - **Multi-Tenant, Buku Kas, Tagihan Iuran, dan Rekapitulasi Lengkap**:
            - Seluruh fitur tata kelola kas organisasi Karang Taruna termigrasi 100% tanpa ada yang tertinggal

          #### Cara Pasang / Update:
          1. Unduh file **kas-go-app.apk** pada daftar Assets di bawah.
          2. Pasang langsung di smartphone Android Anda (otomatis menimpa versi sebelumnya secara konsisten).
          EOF

      - name: Clean existing release tag
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "v2.0.0" --yes --cleanup-tag 2>/dev/null || true

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "Kas Go v2.0.0 (Native Kotlin & Jetpack Compose)"
          body_path: /tmp/release_notes.md
          prerelease: false
          files: dist/kas-go-app.apk
