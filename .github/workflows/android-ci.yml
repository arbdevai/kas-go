name: Android CI (Kas Go Native Kotlin & Jetpack Compose APK)

on:
  push:
    branches:
      - master
      - main
      - "worktree-*"
      - "feat-*"
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref_name }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"

jobs:
  build-native-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
          cache-read-only: false

      - name: Prepare keystore
        run: |
          mkdir -p ~/.android
          if [ -f app/keystore/kasgo_release.p12 ]; then
            cp app/keystore/kasgo_release.p12 ~/.android/debug.keystore
            echo "Keystore resmi terpasang."
          fi

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} dist/kas-go-app.apk \;
          ls -lh dist/

      - name: Prepare release notes
        run: |
          cat << 'EOF' > /tmp/release_notes.md
          ### Kas Go v2.0.1 — Perbaikan Pemilihan Akun Google Native & Masuk Langsung

          Pembaruan & Perbaikan:
          - **Pemilihan Akun Google Native (Langsung & Tanpa Form Manual)**:
            - Menggunakan pemilih akun native resmi Android tanpa perlu pengisian manual email
            - Akun terdaftar langsung masuk ke beranda secara instan
            - Akun baru langsung menampilkan formulir pengisian data diri (Nama, WhatsApp, Alamat)
          - **Penyederhanaan Tampilan Masuk**:
            - Menghapus formulir ganda dan tombol pengurus lama pada halaman autentikasi
            - Pendaftar pertama otomatis mendapatkan hak akses pengurus (Admin/Bendahara)
          - **Ukuran Ringan & Performa Cepat**:
            - Ukuran APK ultra-ringan (~11.9 MB) berbasis 100% Native Jetpack Compose Material 3

          #### Cara Pasang / Update:
          1. Unduh file **kas-go-app.apk** pada daftar Assets di bawah.
          2. Pasang langsung di smartphone Android Anda (otomatis menimpa versi sebelumnya).
          EOF

      - name: Clean existing release tag
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "v2.0.1" --yes --cleanup-tag 2>/dev/null || true

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.1
          name: "Kas Go v2.0.1"
          body_path: /tmp/release_notes.md
          prerelease: false
          files: dist/kas-go-app.apk
