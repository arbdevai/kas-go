name: Android CI (Kas Go Native Kotlin & Jetpack Compose APK)

on:
  push:
    branches:
      - master
      - main
      - "worktree-*"
      - "feat-*"
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref_name }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"

jobs:
  build-native-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          cache-read-only: false

      - name: Compile and sign release APK
        run: gradle :app:compileReleaseKotlin :app:assembleRelease --configuration-cache --build-cache

      - name: Stage APK
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} dist/kas-go-app.apk \;
          ls -lh dist/

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kas-go-release-apk
          path: dist/kas-go-app.apk
          compression-level: 0
          retention-days: 7
