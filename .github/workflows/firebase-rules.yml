name: Firebase Rules Tests

on:
  pull_request:
    paths:
      - "firebase/**"
      - ".github/workflows/firebase-rules.yml"
  workflow_dispatch:

jobs:
  rules-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Install test dependencies
        working-directory: firebase/tests
        run: npm install

      - name: Run Firestore rules tests against emulator
        working-directory: firebase/tests
        run: npm test
