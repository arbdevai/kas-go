name: Firebase Rules Tests

on:
  pull_request:
    paths:
      - "firebase/**"
      - ".github/workflows/firebase-rules.yml"
  workflow_dispatch:

jobs:
  rules-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Validate Firestore rules
        run: |
          test -f firebase/firestore.rules
          echo "Validating rules file syntax..."
          if [ -d "firebase/tests" ] && [ -f "firebase/tests/package.json" ]; then
            cd firebase/tests && npm install && npm test
          else
            echo "firebase/firestore.rules exists and is non-empty."
            head -n 20 firebase/firestore.rules
          fi
