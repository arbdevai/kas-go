name: UI validation

on:
  push:
    branches: ['design/**']
  pull_request:
    paths: ['app/**', '.github/workflows/ui-validation.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test, lint, and build debug APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kas-go-ui-review
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
